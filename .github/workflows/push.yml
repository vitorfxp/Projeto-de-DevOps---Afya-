name: Build e Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          docker build -t ghcr.io/vitorfxp/meu-site:latest .
          docker push ghcr.io/vitorfxp/meu-site:latest
